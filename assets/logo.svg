<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d6fb8"/><stop offset=".62" stop-color="#7fb2e6"/><stop offset="1" stop-color="#cfe3f6"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#f3b52e"/><stop offset="1" stop-color="#c47f06"/></linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe8f5"/></linearGradient>
    <clipPath id="disc"><circle cx="120" cy="120" r="78"/></clipPath>
    <path id="arcTop" d="M 30 120 A 90 90 0 0 1 210 120"/>
    <path id="arcBot" d="M 26 120 A 94 94 0 0 0 214 120"/>
    <g id="feathers">
      <path d="M0 0 C 18 -16 50 -26 82 -24 C 60 -14 34 -6 6 6 Z"/>
      <path d="M2 8 C 24 -4 52 -10 78 -6 C 56 2 32 8 6 16 Z"/>
      <path d="M4 18 C 24 10 46 8 68 12 C 48 18 28 22 8 26 Z"/>
      <path d="M6 28 C 22 24 38 24 54 28 C 38 32 24 34 10 36 Z"/>
    </g>
  </defs>

  <!-- outer badge -->
  <circle cx="120" cy="120" r="118" fill="#ffffff"/>
  <circle cx="120" cy="120" r="114" fill="#0e2c52"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="#f3b52e" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="82" fill="#f3b52e"/>
  <text font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold" font-size="15" letter-spacing="2.2" fill="#ffffff" text-anchor="middle"><textPath href="#arcTop" startOffset="50%">TALAS CIVIL AIR TERMINAL</textPath></text>
  <text font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="bold" font-size="13" letter-spacing="3" fill="#ffd98a" text-anchor="middle" dominant-baseline="hanging"><textPath href="#arcBot" startOffset="50%">ТАЛАС · 2001</textPath></text>
  <g fill="#f3b52e"><path d="M18 120 l5 -4 5 4 -5 4 z"/><path d="M212 120 l5 -4 5 4 -5 4 z"/></g>

  <!-- inner scene -->
  <g clip-path="url(#disc)">
    <rect x="30" y="30" width="180" height="180" fill="url(#sky)"/>
    <!-- Talas Alatau -->
    <path d="M30 150 L62 118 L74 126 L98 96 L112 108 L126 88 L148 114 L160 106 L210 150 Z" fill="#9db7cf"/>
    <path d="M30 156 L56 134 L70 142 L92 120 L108 134 L124 116 L142 136 L158 126 L186 144 L210 140 L210 160 L30 160 Z" fill="#4f6f8f"/>
    <path d="M98 96 L104 104 L100 106 L105 112 L96 110 L90 114 L94 104 Z M126 88 L133 98 L128 99 L134 108 L124 104 L118 108 L121 98 Z M62 118 L67 124 L60 126 Z" fill="url(#snow)"/>
    <!-- steppe and runway -->
    <rect x="30" y="156" width="180" height="60" fill="#3f6d3a"/>
    <path d="M30 156 H210 V162 H30 Z" fill="#5a8a4c"/>
    <path d="M108 156 L132 156 L168 210 L72 210 Z" fill="#2b2f36"/>
    <path d="M119 160 h2 v6 h-2z M118.4 171 h3.2 v8 h-3.2z M117.6 185 h4.8 v10 h-4.8z" fill="#ffffff"/>
    <g fill="#ffffff"><path d="M80 200 h5 v8 h-5z M88 200 h5 v8 h-5z M147 200 h5 v8 h-5z M155 200 h5 v8 h-5z"/></g>
    <circle cx="74" cy="207" r="1.8" fill="#ffd23a"/><circle cx="166" cy="207" r="1.8" fill="#ffd23a"/>
    <circle cx="96" cy="176" r="1.4" fill="#ffd23a"/><circle cx="144" cy="176" r="1.4" fill="#ffd23a"/>
  </g>

  <!-- wings with the centre disc -->
  <g transform="translate(120 80)">
    <g fill="url(#gold)" stroke="#7a4b00" stroke-width="1" stroke-linejoin="round">
      <use href="#feathers" transform="translate(11 -2) scale(.66)"/>
      <use href="#feathers" transform="translate(-11 -2) scale(-.66 .66)"/>
    </g>
    <circle r="13" fill="#0e2c52" stroke="#ffe9a8" stroke-width="2.5"/>
    <path d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z" fill="#ffffff"/>
    <path d="M0 -10 L2.6 -2.6 L0 0 Z M10 0 L2.6 2.6 L0 0 Z M0 10 L-2.6 2.6 L0 0 Z M-10 0 L-2.6 -2.6 L0 0 Z" fill="#9cc3ea"/>
  </g>
  <circle cx="120" cy="120" r="78" fill="none" stroke="#0e2c52" stroke-width="2"/>
</svg>
